version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oficios_valle_lerma_app
    restart: always
    ports:
      # Puerto HTTP principal (modificable via variable de entorno APP_PORT, por defecto 80)
      - "${APP_PORT:-80}:80"
    environment:
      - NODE_ENV=production
    volumes:
      # Configuración de Nginx para SPA (React Router / Vite)
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - oficios_network

networks:
  oficios_network:
    driver: bridge
